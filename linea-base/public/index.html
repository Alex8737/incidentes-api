<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Incidentes</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .login-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); display: flex;
      align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .login-overlay[hidden] { display: none; }
    .login-card { background: #fff; color: #0f172a; border-radius: 12px; padding: 28px; width: 100%; max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .login-card h2 { margin: 0 0 6px; }
    .login-card p { margin: 0 0 16px; font-size: 14px; color: #475569; }
    .login-card label { display: block; font-size: 13px; margin-top: 10px; }
    .login-card input { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .login-card button { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 6px; background: #0ea5e9; color: #fff; font-weight: 600; cursor: pointer; }
    .login-card .error-texto { color: #b91c1c; font-size: 13px; min-height: 18px; margin-top: 8px; }
    .sesion-bar { display: flex; gap: 10px; align-items: center; font-size: 13px; }
    .sesion-bar button { padding: 4px 10px; border-radius: 6px; border: 1px solid #94a3b8; background: transparent; color: inherit; cursor: pointer; }
    .logo-img { width: 40px; height: auto; }
    .aviso-rol { font-size: 13px; background: #fef9c3; color: #713f12; padding: 8px 12px; border-radius: 6px; margin: 0 0 12px; }
  </style>
</head>
<body>
  <!-- Inicio de sesión -->
  <div id="login" class="login-overlay" hidden>
    <form id="form-login" class="login-card" novalidate>
      <h2>Iniciar sesión</h2>
      <p>Acceda con su usuario y contraseña asignados.</p>
      <label>Usuario
        <input name="usuario" autocomplete="username" maxlength="40" required />
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" maxlength="100" required />
      </label>
      <p class="error-texto" id="login-error" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <header class="topbar">
    <div class="topbar__brand">
      <img class="logo-img" src="img/logo.png" alt="Logotipo de la plataforma" />
      <div>
        <h1>Gestión de Incidentes</h1>
        <p>Centro de respuesta · API REST + JWT + Roles</p>
      </div>
    </div>
    <div class="sesion-bar">
      <span id="api-status" class="api-status">Conectando…</span>
      <span id="usuario-info"></span>
      <button id="btn-salir" type="button" hidden>Cerrar sesión</button>
    </div>
  </header>

  <main class="layout">
    <!-- Estadísticas -->
    <section id="stats" class="stats" aria-label="Resumen"></section>

    <div class="columns">
      <!-- Formulario de creación / edición -->
      <aside class="panel">
        <h2 id="form-title">Nuevo incidente</h2>
        <div id="aviso-rol"></div>
        <form id="form-incidente" novalidate></form>
      </aside>

      <!-- Listado -->
      <section class="panel panel--wide">
        <div class="panel__head">
          <h2>Incidentes <span id="contador" class="badge-count">0</span></h2>
        </div>
        <form id="filtros" class="filtros" role="search"></form>
        <div id="lista" class="lista" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
